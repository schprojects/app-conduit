# Integration application + APP-B stub. Credentials come from .env (copy .env.example; never commit .env).
# Build the jars first: ./mvnw verify
services:
  app-b-stub:
    build:
      context: .
      args:
        JAR: app-b-stub/target/app-b-stub-0.1.0-SNAPSHOT.jar
    environment:
      APPB_USER: ${APPB_USER}
      APPB_PASSWORD: ${APPB_PASSWORD}

  integration-app:
    build:
      context: .
      args:
        JAR: integration-app/target/integration-app-0.1.0-SNAPSHOT.jar
    ports:
      - "8080:8080"
    environment:
      INTEGRATION_APP_SHORT_NAME: ${INTEGRATION_APP_SHORT_NAME:-INTX}
      INTEGRATION_INBOUND_USER: ${INTEGRATION_INBOUND_USER}
      INTEGRATION_INBOUND_PASSWORD: ${INTEGRATION_INBOUND_PASSWORD}
      INTEGRATION_OPS_USER: ${INTEGRATION_OPS_USER}
      INTEGRATION_OPS_PASSWORD: ${INTEGRATION_OPS_PASSWORD}
      INTEGRATION_APPB_USER: ${INTEGRATION_APPB_USER}
      INTEGRATION_APPB_PASSWORD: ${INTEGRATION_APPB_PASSWORD}
      INTEGRATION_APPB_URL: http://app-b-stub:8081
    volumes:
      - integration-data:/data
      - integration-logs:/logs
    depends_on:
      - app-b-stub

volumes:
  integration-data:
  integration-logs:
